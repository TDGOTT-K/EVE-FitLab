<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitLab · Sandbox preview</title><link rel="stylesheet" href="sandbox-preview.css"><body>
<header><div><small>FITLAB / EXPERIMENTAL</small><h1 data-text="title"></h1><small id="scene-name"></small></div><p data-text="intro"></p><button id="close" data-text="back"></button></header>
<main><section id="arena"><canvas id="battle" aria-label="2D battle replay"></canvas><div class="arena-top"><span class="live">● <span data-text="replay"></span></span><span id="clock">00:00</span><span class="spacer"></span><button id="reset-view" data-text="view"></button></div><div class="arena-help" data-text="help"></div><div id="loading" data-text="loading"></div><div class="legend"><i class="blue"></i><span data-text="blue"></span><i class="red"></i><span data-text="red"></span></div></section>
<aside><small data-text="fleet"></small><div id="roster"></div><section id="inspect"></section><div id="battle-activity" aria-label="Battle events"></div><div class="note" data-text="scope"></div></aside></main>
<footer><button id="play" disabled data-text="play"></button><button id="restart" disabled data-text="restart"></button><input id="seek" type="range" min="0" max="40" step="0.05" value="0" aria-label="Replay position"><select id="speed" aria-label="Replay speed"><option value="0.5">0.5×</option><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option></select><button id="script-toggle" data-text="script"></button></footer>
<section id="script-panel" hidden><div><b data-text="script"></b><span data-text="script-note"></span></div><pre id="script"></pre></section><script type="module" src="sandbox-preview.js"></script></body></html>
