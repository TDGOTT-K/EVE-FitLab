name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: python -m unittest test_server test_characters test_storage_location test_capacitor test_scenario test_linked_scenario test_calculation_graph -q
      - run: npm run test:share-code
      - run: npm run check:locales
      - run: dotnet build desktop/engine/FitLab.Engine.csproj --nologo
