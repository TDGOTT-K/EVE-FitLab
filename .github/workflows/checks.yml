name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:ui
      - run: npm run check:locales
      - run: npm run test:i18n
      - run: npm run test:share-code
      - run: python -m compileall -q -x "node_modules|.git|output|state" .
# Native integration requires the separately pinned NEngine and fixed SDE.
# Run python scripts/check-phase1.py in the prepared two-repository workspace.
